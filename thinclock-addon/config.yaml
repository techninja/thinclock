---
name: ThinClock
description: Config server for ThinClock ESP32 LED matrix displays
version: "0.1.0"
slug: thinclock
url: https://github.com/techninja/thinclock
arch:
  - aarch64
  - amd64
  - armv7

ports:
  3232/tcp: 3232
ports_description:
  3232/tcp: ThinClock server + UI

ingress: true
ingress_port: 3232
panel_icon: mdi:clock-digital
panel_title: ThinClock

map:
  - data:rw

options:
  device_ip: ""
  timezone: -7
  brightness: 40
  brightness_night: 10
  night_hours: "22,23,0,1,2,3,4,5"
  time_format: "12h"
  temp_unit: "F"
  screen_blocklist: ""
  max_screens: 8
  allow_beeping: true
  wifi_ssid: ""
  wifi_pass: ""
  owm_api_key: ""
  owm_city: ""

schema:
  device_ip: str
  timezone: int
  brightness: int(1,100)
  brightness_night: int(1,100)
  night_hours: str
  time_format: list(12h|24h)
  temp_unit: list(F|C)
  screen_blocklist: str
  max_screens: int(1,20)
  allow_beeping: bool
  wifi_ssid: str
  wifi_pass: password
  owm_api_key: str
  owm_city: str
