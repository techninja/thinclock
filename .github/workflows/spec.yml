name: Spec Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  spec:
    name: Full Spec Compliance
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install ruff
        run: pip install ruff

      - name: Install cppcheck 2.21.0
        run: |
          curl -fsSL https://github.com/danmar/cppcheck/archive/refs/tags/2.21.0.tar.gz | tar xz
          cmake -S cppcheck-2.21.0 -B cppcheck-build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF -DHAVE_RULES=OFF
          cmake --build cppcheck-build -j$(nproc)
          sudo cmake --install cppcheck-build

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Spec compliance
        run: node scripts/spec.js all

      - name: Node tests
        run: node --test tests/*.test.js src/utils/*.test.js src/store/*.test.js

      - name: Browser tests
        run: npx web-test-runner --config .configs/web-test-runner.config.js
